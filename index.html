<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraStore - Modern E-Commerce</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><i class="fa-solid fa-gem"></i> AuraStore</div>
        <ul class="nav-links">
            <li><a href="#/" class="nav-link active" data-link>Home</a></li>
            <li><a href="#/shop" class="nav-link" data-link>Shop</a></li>
            <li><a href="#/wishlist" class="nav-link" data-link><i class="fa-regular fa-heart"></i> Wishlist <span id="wishlist-count" class="badge">0</span></a></li>
            <li><a href="#/cart" class="nav-link" data-link><i class="fa-solid fa-bag-shopping"></i> Bag <span id="cart-count" class="badge">0</span></a></li>
        </ul>
    </nav>

    <main id="app" class="container">
        <!-- Dynamic Views -->
    </main>

    <footer class="footer">
        <p>&copy; 2026 AuraStore. Crafted with aesthetic elegance & modular JavaScript.</p>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
